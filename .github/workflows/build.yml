name: Build SystemUpdater APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Minimal SystemUpdater APK
        run: |
          mkdir -p src/com/doogee/ota
          printf '<manifest xmlns:android="http://android.com" package="com.doogee.ota" android:versionCode="1" android:versionName="1.0"><uses-sdk android:minSdkVersion="30" android:targetSdkVersion="34"/><application android:label="System update"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.settings.SYSTEM_UPDATE_SETTINGS"/><category android:name="android.intent.category.DEFAULT"/></intent-filter></activity></application></manifest>\n' > AndroidManifest.xml

          printf 'package com.doogee.ota;\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.os.Bundle;\npublic class MainActivity extends Activity {\n@Override protected void onCreate(Bundle b) {\nsuper.onCreate(b);\nIntent i = getPackageManager().getLaunchIntentForPackage("dev.imranr.obtainium");\nif (i != null) startActivity(i);\nfinish();\n}}\n' > src/com/doogee/ota/MainActivity.java

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          javac -source 1.8 -target 1.8 -cp "$PLATFORM" -d . src/com/doogee/ota/MainActivity.java
          $BUILD_TOOLS/d8 --lib "$PLATFORM" --output . com/doogee/ota/MainActivity.class
          $BUILD_TOOLS/aapt2 link -o unaligned.apk -I "$PLATFORM" --manifest AndroidManifest.xml
          zip -j unaligned.apk classes.dex
          $BUILD_TOOLS/zipalign -f 4 unaligned.apk aligned.apk
          keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Doogee"
          $BUILD_TOOLS/apksigner sign --ks key.jks --ks-pass pass:123456 --out SystemUpdater.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SystemUpdater-APK
          path: SystemUpdater.apk
